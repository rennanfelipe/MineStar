name: CI
on:
  push:
    branches: 
     - feature/*
     - feat/*

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run CI
        run: npm run ci